/* Presenter cursor: a high-visibility halo that tracks the pointer, pulses on
   click, and toggles with C. An overlay beats a custom CSS cursor: browsers cap
   cursor images at sizes too small to read on a projector. */
(function(){
  var ring = document.createElement('div');
  ring.id = 'pcur';
  var enabled = true, seen = false;
  function mount(){ document.body.appendChild(ring); }
  if (document.body) mount(); else document.addEventListener('DOMContentLoaded', mount);
  document.addEventListener('mousemove', function(e){
    ring.style.left = e.clientX + 'px'; ring.style.top = e.clientY + 'px';
    seen = true;
    ring.classList.toggle('on', enabled);
  }, {passive:true});
  document.addEventListener('mousedown', function(e){
    if(!enabled) return;
    ring.classList.add('down');
    var p = document.createElement('div');
    p.className = 'pclick';
    p.style.left = e.clientX + 'px'; p.style.top = e.clientY + 'px';
    document.body.appendChild(p);
    setTimeout(function(){ p.remove(); }, 600);
  }, {passive:true});
  document.addEventListener('mouseup', function(){ ring.classList.remove('down'); }, {passive:true});
  document.documentElement.addEventListener('mouseleave', function(){ ring.classList.remove('on'); });
  window.addEventListener('keydown', function(e){
    if(e.key==='c'||e.key==='C'){ enabled=!enabled; ring.classList.toggle('on', enabled&&seen); }
  });
})();
</script>

function App(){
  const [view,setView] = useState('teams');
  const [delivered,setDelivered] = useState(false);
  const [t,setT] = useState(0);
  const [step,setStep] = useState(0);        // 0 = not started; 1..N = phase reached
  const tween = useRef(null);                 // {from, goal, elapsed, dur} while easing, else null
  const stepRef = useRef(0); stepRef.current = step;
  const viewRef = useRef(view); viewRef.current = view;

  const goalFor = i => i<=0 ? 0 : STEP_TS[Math.min(i,STEP_TS.length)-1];
  // Ease over a duration proportional to the span, so each phase reveals calmly.
  const startTween = (from,goal) => { tween.current = {from, goal, elapsed:0,
    dur: Math.min(5, Math.max(2.4, Math.abs(goal-from)*0.4))}; };

  const next = () => { const ni=Math.min(STEP_TS.length, stepRef.current+1);
    if(ni===stepRef.current) return; setStep(ni); stepRef.current=ni; startTween(t, goalFor(ni)); };
  const prev = () => { const ni=Math.max(0, stepRef.current-1);
    if(ni===stepRef.current) return; setStep(ni); stepRef.current=ni; tween.current=null; setT(goalFor(ni)); };
  const startRun = () => { setView('dashboard'); setStep(1); stepRef.current=1; setT(0); startTween(0, goalFor(1)); };
  const restart  = () => { setStep(1); stepRef.current=1; setT(0); startTween(0, goalFor(1)); };
  const finishRun = () => { tween.current=null; setDelivered(true); setView('teams'); };
  const backToTeams = () => { tween.current=null; setView('teams'); };

  // gentle tween loop — eases the clock toward the current phase target, then rests
  useEffect(()=>{
    let raf, last=null;
    const loop = ts => {
      if(last==null) last=ts;
      const dt=(ts-last)/1000; last=ts;
      const tw = tween.current;
      if(tw){ tw.elapsed += dt;
        const p = tw.dur>0 ? Math.min(1, tw.elapsed/tw.dur) : 1;
        setT(tw.from + (tw.goal-tw.from)*smooth(p));
        if(p>=1){ setT(tw.goal); tween.current=null; }
      }
      raf=requestAnimationFrame(loop);
    };
    raf=requestAnimationFrame(loop);
    return ()=>cancelAnimationFrame(raf);
  },[]);

  useEffect(()=>{
    const h = e => {
      if(viewRef.current!=='dashboard') return;   // Teams screen handles its own keys
      const atEnd = stepRef.current>=STEP_TS.length;
      if(e.key==='ArrowRight'||e.code==='Space'||e.key==='Enter'){
        e.preventDefault(); if(atEnd) finishRun(); else next(); }
      else if(e.key==='ArrowLeft'){prev();}
      else if(e.key==='r'||e.key==='R'){restart();}
      else if(e.key==='Escape'){backToTeams();}
      else if(e.key==='f'||e.key==='F'){document.documentElement.requestFullscreen?.();}
    };
    window.addEventListener('keydown',h); return ()=>window.removeEventListener('keydown',h);
  });

  // motion.dev enter animations
  useLayoutEffect(()=>{ runEnterAnimations(); });

  // anime.js: gentle staggered lane entrance each time the dashboard opens
  useEffect(()=>{
    if(view!=='dashboard' || !anime) return;
    anime({targets:'.lane-card', opacity:[0,1], translateY:[16,0], easing:'easeOutQuad',
      duration:520, delay:anime.stagger(70,{start:120})});
  },[view]);

  // derived metrics — tied to what is actually on screen
  const revealedSections = LANES.reduce((a,l)=>a+l.sections.filter(s=>t>=s.at).length,0) + (t>=0.05?1:0);
  const leaders = LANES.find(l=>l.id==='leadership').sections.find(s=>s.people).people.filter(p=>t>=p.at).length;
  const ramp = (target,s,e)=> Math.round(target*smooth((t-s)/(e-s)));
  const endow = METRICS.endowment*smooth((t-6.5)/(15-6.5)); // ramps 0 -> $165.9M

  const laneActive = LANES.map(l=> t>=l.start && t<l.end);
  const laneInDone = LANES.map(l=> t>=l.end && t<T.asmEnd);
  const laneColors = LANES.map(l=>l.color);

  // TeamsScreen stays mounted (hidden during the run) so the chat history,
  // scripted beats, and composer state survive the dashboard round-trip.
  return html`<${Fragment}>
    <${TeamsScreen} hidden=${view!=='teams'} delivered=${delivered} onWatchRun=${startRun}/>
    ${view==='dashboard' && html`<div class="h-screen w-screen flex flex-col gap-2.5 p-3">
    <!-- header — M&Q navy banner (matches the .docx title banner) -->
    <div class="flex items-center gap-3 shrink-0 rounded-xl px-3.5 py-2"
      style=${{background:'var(--navy)',borderBottom:'3px solid var(--gold)'}}>
      <div class="flex items-center gap-2.5 min-w-0">
        <svg width="26" height="26" viewBox="0 0 1200 1200" style=${{display:'block',flexShrink:0}} role="img" aria-label="McAllister and Quinn">
          <polygon points="600,120 1010,365 1010,835 600,1080 190,835 190,365" fill="none" stroke="var(--cyan)" stroke-width="52"/>
          <polygon points="600,330 810,455 810,745 600,870 390,745 390,455" fill="var(--cyan-soft)"/>
        </svg>
        <div class="text-[15px] font-black tracking-tight" style=${{color:'#fff'}}>McALLISTER & QUINN</div>
        <span style=${{color:'rgba(255,255,255,.28)'}}>│</span>
        <div class="text-[13.5px] font-semibold" style=${{color:'var(--cyan-soft)'}}>BD Profile Agent</div>
        <span class="inline-flex items-center gap-1.5 text-[10px] font-bold uppercase tracking-wide px-2 py-0.5 rounded-full"

          style=${{background:'var(--gold-soft)',color:'var(--gold)',border:'1px solid #e6d3a6'}}>
          <span class="dot blink" style=${{color:'var(--gold)'}}></span>Guided demo</span>

          <span class="text-[10.5px] font-bold uppercase tracking-wide" style=${{color:'var(--navy)'}}>
            Five research agents — running concurrently</span>
          <div class="flex-1 h-px" style=${{background:'var(--line2)'}}></div>
          <span class="text-[10.5px] font-semibold" style=${{color:laneActive.some(Boolean)?'var(--run)':'var(--mut)'}}>
            ${laneActive.filter(Boolean).length} of 5 working now · ${laneInDone.filter(Boolean).length} finished</span>
        </div>
        <div class="grid gap-2.5 flex-1 min-h-0" style=${{gridTemplateColumns:'repeat(5,1fr)'}}>
          ${LANES.map(l=> html`<div key=${l.id} class="lane-card flex flex-col min-h-0">
            <${LaneCard} lane=${l} t=${t}/></div>`)}
        </div>
        <${FanSVG} dir="in" active=${laneInDone} colors=${laneColors}/>
        <div class="flex gap-2.5 shrink-0">
          <${StageChip} label="Assemble" sub="merging five agents’ sections" icon="🧩"
            state=${stageState(t,T.asmStart,T.asmEnd)} ac="#7a6fce"/>
          <${StageChip} label="Compile" sub="formats the Word document" icon="⚙️"
            state=${stageState(t,T.compStart,T.compDone)} ac="var(--run)"/>
          <${Deliverable} t=${t}/>
        </div>
      </div>

      <div class="flex flex-col gap-2.5 min-h-0">
        <div class="grid grid-cols-2 gap-2.5 shrink-0">
          <${MetricTile} label="Sections drafted" value=${revealedSections} accent="var(--navy)"/>
          <${MetricTile} label="Endowment (FY24)" value=${endow} digits=${1} prefix="$" suffix="M" accent="var(--navy)"/>
          <${MetricTile} label="Federal awards" value=${ramp(METRICS.awards,9,15)} accent="var(--c-fed)"/>
          <${MetricTile} label="Federal sponsors" value=${ramp(METRICS.sponsors,9,15)} accent="var(--c-fin)"/>
        </div>
        <${ActivityLog} t=${t}/>
      </div>
    </div>

    <${Controls} step=${step} next=${next} prev=${prev} restart=${restart}
      onBack=${backToTeams} onFinish=${finishRun}/>
  </div>`}
  <//>`;
}

ReactDOM.createRoot(document.getElementById('root')).render(html`<${App}/>`);
} // run()

if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
else boot();
})();
</script>
</body>
</html>
