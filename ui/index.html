<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BD Profile · Pipeline Board</title>
<style>
  :root {
    --bg:#0f1115; --panel:#171a21; --panel2:#1d212b; --line:#2a2f3a;
    --ink:#e7e9ee; --mut:#9aa3b0;
    --todo:#3a3f4b; --run:#2d6cdf; --review:#b8860b; --done:#2e8b57;
    --accent:#4f8cff; --bad:#e0544e;
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink);
    font:14px/1.45 -apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif; }
  header { padding:14px 20px; border-bottom:1px solid var(--line);
    display:flex; gap:16px; align-items:center; flex-wrap:wrap; background:var(--panel); }
  header h1 { font-size:16px; margin:0; font-weight:600; }
  header .id { color:var(--mut); font-size:13px; }
  header .spacer { flex:1; }
  .ident input { background:var(--panel2); border:1px solid var(--line); color:var(--ink);
    border-radius:6px; padding:5px 8px; font-size:13px; margin-left:4px; }
  .ident input.name { width:230px; } .ident input.st { width:46px; } .ident input.ein { width:110px; }
  select, button { background:var(--panel2); border:1px solid var(--line); color:var(--ink);
    border-radius:6px; padding:5px 9px; font-size:13px; cursor:pointer; }
  button.primary { background:var(--accent); border-color:var(--accent); color:#0a0d12; font-weight:600; }
  button:disabled { opacity:.4; cursor:not-allowed; }
  .tick { color:var(--mut); font-size:12px; }
  main { display:grid; grid-template-columns:repeat(4,1fr); gap:14px; padding:18px 20px; }
  .col { background:var(--panel); border:1px solid var(--line); border-radius:10px;
    padding:10px; min-height:200px; }
  .col h2 { font-size:12px; text-transform:uppercase; letter-spacing:.06em; color:var(--mut);
    margin:4px 6px 12px; display:flex; justify-content:space-between; }
  .card { background:var(--panel2); border:1px solid var(--line); border-left:3px solid var(--todo);
    border-radius:8px; padding:11px 12px; margin-bottom:10px; }
  .card.s-running { border-left-color:var(--run); }
  .card.s-done { border-left-color:var(--done); }
  .card.s-review { border-left-color:var(--review); }
  .card.s-blocked { opacity:.6; }
  .card .t { font-weight:600; font-size:13.5px; display:flex; align-items:center; gap:7px; }
  .card .meta { color:var(--mut); font-size:11.5px; margin:3px 0 0; }
  .card .detail { color:#c7cdda; font-size:12px; margin-top:6px; }
  .card .hint { color:var(--mut); font-size:11.5px; margin-top:6px; }
  .badge { font-size:10px; padding:1px 6px; border-radius:20px; border:1px solid var(--line);
    color:var(--mut); text-transform:uppercase; letter-spacing:.04em; }
  .badge.agent { color:#c9a8ff; border-color:#4b3b6b; }
  .badge.script { color:#8fd0ff; border-color:#2b4d66; }
  .badge.manual { color:#ffcf8f; border-color:#6b5a2b; }
  .row { display:flex; gap:7px; margin-top:9px; align-items:center; flex-wrap:wrap; }
  .dot { width:7px; height:7px; border-radius:50%; background:var(--todo); }
  .dot.running { background:var(--run); animation:pulse 1s infinite; }
  .dot.done { background:var(--done); } .dot.review { background:var(--review); }
  .dot.blocked { background:#555; }
  @keyframes pulse { 50% { opacity:.35; } }
  button.sm { padding:3px 8px; font-size:12px; }
  .spin { display:inline-block; width:11px; height:11px; border:2px solid var(--line);
    border-top-color:var(--run); border-radius:50%; animation:rot .8s linear infinite; }
  @keyframes rot { to { transform:rotate(360deg); } }
  #logwrap { margin:0 20px 20px; background:#0a0c10; border:1px solid var(--line);
    border-radius:10px; display:none; }
  #logwrap .bar { display:flex; justify-content:space-between; padding:8px 12px;
    border-bottom:1px solid var(--line); color:var(--mut); font-size:12px; }
  #log { margin:0; padding:12px; font:12px/1.5 ui-monospace,Menlo,Consolas,monospace;
    white-space:pre-wrap; max-height:280px; overflow:auto; color:#cdd3df; }
  .toast { position:fixed; bottom:18px; right:18px; background:var(--panel2);
    border:1px solid var(--line); border-radius:8px; padding:10px 14px; font-size:13px;
    box-shadow:0 6px 24px rgba(0,0,0,.4); display:none; }
  .toast.bad { border-color:var(--bad); color:#ffb4b0; }
  #hswrap { margin:0 20px 20px; background:var(--panel); border:1px solid var(--line);
    border-radius:10px; display:none; }
  #hswrap .bar { display:flex; justify-content:space-between; padding:8px 12px;
    border-bottom:1px solid var(--line); color:var(--mut); font-size:12px; }
  #hslist { padding:12px; display:flex; flex-direction:column; gap:10px; }
  .hsrow { display:flex; gap:14px; align-items:center; background:var(--panel2);
    border:1px solid var(--line); border-radius:8px; padding:10px; }
  .hsimg { width:84px; height:84px; object-fit:cover; border-radius:6px;
    border:1px solid var(--line); flex:none; }
  .hsimg.none { display:flex; align-items:center; justify-content:center; text-align:center;
    color:var(--mut); font-size:11px; padding:4px; background:#10131a; }
  .hsmeta { flex:1; }
  .hsname { font-weight:600; font-size:13.5px; margin-bottom:6px; }
  .hsbtns { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .hsstatus { font-size:11.5px; color:var(--mut); text-transform:uppercase; letter-spacing:.04em; }
  button.bad { background:#3a1f1f; border-color:var(--bad); color:#ffb4b0; }
  button.on { background:var(--accent); border-color:var(--accent); color:#0a0d12; font-weight:600; }
</style>
</head>
<body>
<header>
  <h1>BD Profile · Pipeline Board</h1>
  <span class="id" id="ident">no intake yet</span>
  <div class="spacer"></div>
  <div class="ident">
    <input class="name" id="f-name" placeholder="Institution">
    <input class="st"   id="f-state" placeholder="ST" maxlength="2">
    <input class="ein"  id="f-ein" placeholder="EIN">
  </div>
  <label class="tick">draft variant
    <select id="variant">
      <option value="">Full</option>
      <option value="short">Short</option>
      <option value="former_client">Former client</option>
    </select>
  </label>
  <span class="tick" id="tick">—</span>
</header>

<main id="board"></main>

<div id="logwrap">
  <div class="bar"><span id="logtitle">log</span>
    <button class="sm" onclick="closeLog()">close</button></div>
  <pre id="log"></pre>
</div>

<div id="hswrap">
  <div class="bar"><span>Headshot approval — approve or reject each sourced photo before it is embedded</span>
    <button class="sm" onclick="closeHeadshots()">close</button></div>
  <div id="hslist"></div>
</div>

<div class="toast" id="toast"></div>

<script>
const COLDOT = {todo:"", running:"running", done:"done", review:"review", blocked:"blocked"};
let openLogId = null;

async function api(path, opts) {
  const r = await fetch(path, opts);
  let body = {}; try { body = await r.json(); } catch {}
  return { ok: r.ok, status: r.status, body };
}
function toast(msg, bad) {
  const t = document.getElementById("toast");
  t.textContent = msg; t.className = "toast" + (bad ? " bad" : "");
  t.style.display = "block"; setTimeout(() => t.style.display = "none", 3200);
}

async function run(id) {
  const payload = {
    name: document.getElementById("f-name").value.trim(),
    state: document.getElementById("f-state").value.trim(),
    ein: document.getElementById("f-ein").value.trim(),
    variant: document.getElementById("variant").value,
  };
  const r = await api("/api/run/" + id, {
    method: "POST", headers: {"Content-Type": "application/json"},
    body: JSON.stringify(payload),
  });
  if (!r.ok) return toast(r.body.error || "failed to start", true);
  toast(id + ": started"); showLog(id); refresh();
}
async function review(approved) {
  const r = await api("/api/review", {
    method: "POST", headers: {"Content-Type": "application/json"},
    body: JSON.stringify({approved}),
  });
  if (!r.ok) return toast(r.body.error || "failed", true);
  toast(approved ? "review approved" : "approval cleared"); refresh();
}

let hsOpen = false;
async function openHeadshots() { hsOpen = true;
  document.getElementById("hswrap").style.display = "block"; await loadHeadshots(); }
function closeHeadshots() { hsOpen = false;
  document.getElementById("hswrap").style.display = "none"; }
async function loadHeadshots() {
  const r = await api("/api/headshots");
  if (!r.ok) return;
  const el = document.getElementById("hslist");
  if (!r.body.candidates.length) {
    el.innerHTML = `<div class="hint">No leader photos in the draft yet — assemble first.</div>`;
    return;
  }
  el.innerHTML = r.body.candidates.map(c => {
    const thumb = c.is_url
      ? `<img class="hsimg" src="${c.photo}" referrerpolicy="no-referrer" alt="">`
      : `<div class="hsimg none">no sourced photo</div>`;
    let ctrl;
    if (c.is_url) {
      ctrl = `<div class="hsbtns">
        <button class="sm ${c.status === 'approved' ? 'on' : ''}" onclick="decide('${encodeURIComponent(c.photo)}','approved')">Approve</button>
        <button class="sm ${c.status === 'rejected' ? 'bad' : ''}" onclick="decide('${encodeURIComponent(c.photo)}','rejected')">Reject</button>
        <span class="hsstatus">${c.status}</span></div>`;
    } else {
      ctrl = `<div class="hsbtns"><span class="hsstatus">placeholder · ${escapeHtml(c.photo)}</span></div>`;
    }
    return `<div class="hsrow">${thumb}<div class="hsmeta">
      <div class="hsname">${escapeHtml(c.leader)}</div>${ctrl}</div></div>`;
  }).join("");
}
async function decide(encUrl, decision) {
  const url = decodeURIComponent(encUrl);
  const r = await api("/api/headshots", {
    method: "POST", headers: {"Content-Type": "application/json"},
    body: JSON.stringify({url, decision}),
  });
  if (!r.ok) return toast(r.body.error || "failed", true);
  toast("headshot " + decision); loadHeadshots(); refresh();
}

function showLog(id) { openLogId = id; document.getElementById("logwrap").style.display = "block";
  document.getElementById("logtitle").textContent = "log · " + id; pollLog(); }
function closeLog() { openLogId = null; document.getElementById("logwrap").style.display = "none"; }
async function pollLog() {
  if (!openLogId) return;
  const r = await api("/api/log/" + openLogId);
  const el = document.getElementById("log");
  const atBottom = el.scrollTop + el.clientHeight >= el.scrollHeight - 20;
  el.textContent = r.body.log || "(no output yet)";
  if (atBottom) el.scrollTop = el.scrollHeight;
}

function cardHTML(s) {
  const dot = COLDOT[s.status] || "";
  let actions = "";
  if (s.kind === "script") {
    actions = `<button class="sm primary" ${s.runnable ? "" : "disabled"}
      onclick="run('${s.id}')">${s.status === "running" ? "running…" : "Run"}</button>`;
  } else if (s.kind === "manual") {
    if (s.status === "done")
      actions = `<button class="sm" onclick="review(false)">Reopen</button>`;
    else
      actions = `<button class="sm primary" onclick="review(true)">Approve</button>`;
  } else if (s.kind === "headshots") {
    actions = `<button class="sm primary" onclick="openHeadshots()">Review photos</button>`;
  } else { // agent
    actions = `<span class="hint">${escapeHtml(s.hint)}</span>`;
  }
  const logBtn = (s.kind === "script")
    ? `<button class="sm" onclick="showLog('${s.id}')">log</button>` : "";
  const running = s.status === "running" ? `<span class="spin"></span>` : "";
  return `<div class="card s-${s.status}">
    <div class="t"><span class="dot ${dot}"></span>${escapeHtml(s.title)} ${running}</div>
    <div class="meta"><span class="badge ${s.kind}">${s.kind}</span> · ${escapeHtml(s.owner)}</div>
    ${s.detail ? `<div class="detail">${escapeHtml(s.detail)}</div>` : ""}
    ${s.kind !== "agent" && s.hint ? `<div class="hint">${escapeHtml(s.hint)}</div>` : ""}
    <div class="row">${actions} ${logBtn}</div>
  </div>`;
}
function escapeHtml(x){return (x||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}

let identTouched = false;
["f-name","f-state","f-ein"].forEach(id =>
  document.getElementById(id).addEventListener("input", () => identTouched = true));

async function refresh() {
  const r = await api("/api/state");
  if (!r.ok) return;
  const st = r.body;
  document.getElementById("tick").textContent = "synced " + st.now;
  const idn = st.identity;
  document.getElementById("ident").textContent = idn.exists
    ? `${idn.institution || "?"} · ${idn.state || "?"}${idn.ein ? " · EIN " + idn.ein : ""}`
    : "no intake yet — fill identity to warm fetches";
  if (!identTouched) {
    if (idn.institution) document.getElementById("f-name").value = idn.institution;
    if (idn.state) document.getElementById("f-state").value = idn.state;
    if (idn.ein) document.getElementById("f-ein").value = idn.ein;
  }
  const board = document.getElementById("board");
  board.innerHTML = st.columns.map(col => {
    const cards = st.steps.filter(s => s.column === col);
    return `<div class="col"><h2><span>${col}</span><span>${cards.length}</span></h2>
      ${cards.map(cardHTML).join("")}</div>`;
  }).join("");
}

refresh();
setInterval(refresh, 2500);
setInterval(pollLog, 1500);
</script>
</body>
</html>
